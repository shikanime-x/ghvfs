[package]
name = "ghvfs"
version = "0.1.0"
edition = "2024"
description = "Expose GitHub issues as a local tree of markdown files with metadata"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify = { version = "8", default-features = false }
